name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  # ── Job 1: vet + build + unit tests (sem Docker) ─────────────────────────
  unit:
    name: Vet, Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o /dev/null ./cmd/api/

      - name: Unit tests
        run: go test ./internal/service/... ./internal/validation/... -v -count=1

  # ── Job 2: integration + acceptance tests (precisam do Docker) ────────────
  integration:
    name: Integration & Acceptance Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate RSA key pair for tests
        run: |
          mkdir -p keys
          openssl genrsa -out keys/private.pem 2048
          openssl rsa -in keys/private.pem -pubout -out keys/public.pem

      - name: Integration tests (repository)
        run: go test ./internal/repository/... -v -count=1 -timeout 120s

      - name: Acceptance tests
        run: go test ./internal/acceptance/... -v -count=1 -timeout 180s